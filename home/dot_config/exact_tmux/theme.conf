# Catppuccin Mocha palette, set by hand instead of the catppuccin/tmux plugin.
set -g @thm_base '#1e1e2e'
set -g @thm_mantle '#181825'
set -g @thm_crust '#11111b'
set -g @thm_text '#cdd6f4'
set -g @thm_overlay_2 '#9399b2'
set -g @thm_surface_1 '#45475a'
set -g @thm_surface_0 '#313244'
set -g @thm_lavender '#b4befe'
set -g @thm_blue '#89b4fa'
set -g @thm_green '#a6e3a1'
set -g @thm_yellow '#f9e2af'
set -g @thm_peach '#fab387'
set -g @thm_red '#f38ba8'
set -g @thm_teal '#94e2d5'
set -g @thm_mauve '#cba6f7'
set -g @thm_overlay_0 '#6c7086'

# tmux 3.8 styles menus, choose-tree, display-panes and copy-mode with "theme*" colours.
set -s theme dark
set -sF dark-theme-black '#{@thm_crust}'
set -sF dark-theme-white '#{@thm_text}'
set -sF dark-theme-light-grey '#{@thm_overlay_0}'
set -sF dark-theme-dark-grey '#{@thm_mantle}'
set -sF dark-theme-green '#{@thm_green}'
set -sF dark-theme-yellow '#{@thm_yellow}'
set -sF dark-theme-red '#{@thm_red}'
set -sF dark-theme-blue '#{@thm_blue}'
set -sF dark-theme-cyan '#{@thm_teal}'
set -sF dark-theme-magenta '#{@thm_mauve}'

set -gF mode-style 'bg=#{@thm_surface_0},fg=#{@thm_text}'
set -gF pane-border-style 'fg=#{@thm_surface_1}'
set -gF pane-active-border-style 'fg=#{@thm_blue}'
set -gF popup-border-style 'fg=#{@thm_blue}'
set -gF menu-style 'bg=#{@thm_base},fg=#{@thm_text}'
set -gF menu-border-style 'bg=#{@thm_base},fg=#{@thm_blue}'
set -wgF tree-mode-border-style 'bg=#{@thm_base},fg=#{@thm_blue}'
set -wgF display-panes-border-style 'bg=#{@thm_base},fg=#{@thm_blue}'
