### configure Tmux Plugin Manager
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

unbind r
bind r source-file ~/.tmux.conf
# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on
set -g visual-activity off
set -g detach-on-destroy off
set -g status-position top

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Notifying if other windows has activities
setw -g monitor-activity on

# Renumber windows on window close
set -g renumber-windows on

# split panes using | and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# numToStr/Navigator.nvim integration
version_path='s/^tmux[^0-9]*([.0-9]+).*/\1/p'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-w h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-w j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-w k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-w l" "select-pane -R"
tmux_version="$(tmux -V | sed -En "$version_path")"
setenv -g tmux_version "$tmux_version"

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l
# numToStr/Navigator.nvim integration end

bind-key q kill-pane

# Sesh session picker (television-powered)
bind-key "T" display-popup -E -w 80% -h 70% -T 'Sesh' tv sesh

# WorkMux task picker (television-powered)
bind-key "W" display-popup -E \
  -w 80% -h 70% \
  -d '#{pane_current_path}' \
  -T 'WorkMux Tasks' \
  tv workmux

# Toggle the live workmux sidebar.
bind-key "B" run-shell -b \
  -c '#{pane_current_path}' \
  'workmux sidebar'

# Open the workmux dashboard in a floating popup.
bind-key "D" display-popup -E \
  -w 90% -h 80% \
  -d '#{pane_current_path}' \
  -T 'WorkMux Dashboard' \
  workmux dashboard

# Television standalone pickers
bind-key "f" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Files' tv files
bind-key "g" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Grep' tv text
bind-key "a" display-popup -E -w 80% -h 70% -T 'AeroSpace Windows' tv aerospace-windows
bind -n M-H previous-window
bind -n M-L next-window

# Sesh last-session toggle
bind -N "last-session (via sesh)" L run-shell "sesh last"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix + space

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Keep Catppuccin's palette, borders and popup styling; render our own text tabs.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_status_background '#{@thm_mantle}'

# Load plugins before applying the minimal text status bar. Keep its colors tied
# to Catppuccin's palette; Catppuccin paints the status and message background mantle.
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# tmux 3.8 styles menus, choose-tree, display-panes and copy-mode with "theme*"
# colours that Catppuccin doesn't set; point them at the mocha palette.
set -s theme dark
set -sF dark-theme-black '#{@thm_crust}'
set -sF dark-theme-white '#{@thm_fg}'
set -sF dark-theme-light-grey '#{@thm_overlay_0}'
set -sF dark-theme-dark-grey '#{@thm_mantle}'
set -sF dark-theme-green '#{@thm_green}'
set -sF dark-theme-yellow '#{@thm_yellow}'
set -sF dark-theme-red '#{@thm_red}'
set -sF dark-theme-blue '#{@thm_blue}'
set -sF dark-theme-cyan '#{@thm_teal}'
set -sF dark-theme-magenta '#{@thm_mauve}'

# Borders: base background, blue lines. Menu body matches the border background.
set -gF menu-style 'bg=#{@thm_bg},fg=#{@thm_fg}'
set -gF menu-border-style 'bg=#{@thm_bg},fg=#{@thm_blue}'
set -wgF tree-mode-border-style 'bg=#{@thm_bg},fg=#{@thm_blue}'
set -wgF display-panes-border-style 'bg=#{@thm_bg},fg=#{@thm_blue}'

set -g status-left-length 60
set -g status-right-length 0
set -g status-left '#[fg=#{?client_prefix,#{@thm_peach},#{@thm_green}}] [#S] #[default]'
set -g status-right ''
set -g status-justify absolute-centre
setw -g window-status-separator ' '
setw -gF window-status-style 'bg=default,fg=#{@thm_overlay_2}'
setw -gF window-status-current-style 'bg=default,fg=#{@thm_lavender},bold'
setw -gF window-status-activity-style 'bg=default,fg=#{@thm_yellow}'
setw -gF window-status-bell-style 'bg=default,fg=#{@thm_red}'
setw -g window-status-format '[#{?window_zoomed_flag,:,}#{?@workmux_status,#{@workmux_status}:,}#W:#I]'
setw -g window-status-current-format '[#{?window_zoomed_flag,:,}#{?@workmux_status,#{@workmux_status}:,}#W:#I]'
